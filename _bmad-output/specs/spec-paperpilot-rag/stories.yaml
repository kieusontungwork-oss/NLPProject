# Checkpoint flags (per the stories schema; caller-only: the implementing dev skill never reads them):
#   spec_checkpoint: true -> a human reviews this story's spec between planning and implementation.
#   done_checkpoint: true -> dispatch pauses after this story completes, before anything further runs.
# A story may carry both (e.g., story 6: spec reviewed up front, and completion gates the eval set).

- id: "1"
  title: "Week-0 data spike: verify arXiv candidates and pick the KB source"
  description: >-
    Downloads test slices of the three arXiv full-text candidates (S2ORC cs.*, HF scientific_papers,
    Kaggle arXiv dumps) and produces the source decision plus sparse-engine decision data. Covers the
    CAP-1 precondition and resolves two open questions in SPEC.md.
  done_checkpoint: true
  invoke_dev_with: >-
    No dataset enters the plan without bytes-on-disk proof of a real download. For each candidate
    record: verified download size, section-structure quality, license, estimated chunk count for
    10k papers, and a one-off BM25-vs-FAISS scale sanity check. Write findings to
    _bmad-output/planning-artifacts/research/ as a dated data-spike note.

- id: "2"
  title: "Knowledge-base pipeline: clean, dedup, chunk, and stats"
  description: >-
    Build the one-command KB rebuild from the chosen source: boilerplate stripping, content-hash
    dedup, section-aware chunking with header prefixes, metadata retention, and kb_stats.json.
    Implements CAP-1.
  done_checkpoint: true
  invoke_dev_with: >-
    Chunking is a graded design choice per the brief: implement structure-aware 256-512-token
    chunks with ~15% overlap, abstract as its own chunk, title+section header prefix on every chunk.
    Join every paper against an arXiv metadata snapshot (public gs://arxiv-dataset
    metadata-v5/arxiv-metadata-oai.json, keyed by arxiv_id; re-insert the slash in pre-2007 ids,
    e.g. nlin0608019 -> nlin/0608019) to fill title/authors/year/categories/license-when-present.
    The same join performs the category filter: KB composition = cs.* categories (~16k papers
    expected; AI/ML/NLP ~7.5k is the primary subcollection). A paper whose metadata row is missing
    is dropped, not emitted with nulls: CAP-4 citation resolvability must be 100%. If the cs.*
    filter yields <12k papers pre-clean, widen the filter to all arXiv categories for the remainder
    (composition documented in kb_stats.json). kb_stats.json must report papers, chunks, words,
    types, plus year_min/year_max and a year histogram (corpus ends 2017). Output chunk + paper
    JSONL per the schema in pipeline-stages.md.

- id: "3"
  title: "Baseline retrieval: BM25 + dense + RRF hybrid"
  description: >-
    Implement the three baseline legs (sparse, dense, hybrid fusion) behind toggleable interfaces
    with per-stage latency logging. Implements CAP-2.
  invoke_dev_with: >-
    Never SQL LIKE. Sparse and dense engines each behind a Python interface (SparseRetriever /
    DenseRetriever) so the engine is a config swap, never a code fork. Single retrieve(query, k)
    API returning the RRF-fused ranking; log per-stage latency.

- id: "4"
  title: "Eval harness v1: retrieval metrics from qrels"
  description: >-
    Wire ir_measures into a make eval target that scores any retrieval configuration against qrels
    and emits metrics.json plus the ablation-table skeleton. Implements the retrieval half of CAP-5.
  invoke_dev_with: >-
    Every number that will appear in the final report must reproduce from make eval into
    reports/metrics.json. Metrics: P@5/P@10, Recall@10, MRR, nDCG@10 via ir_measures, plus a
    judged@10 diagnostic per row (share of top-10 that has a qrels judgment; below ~90% the row
    is not comparable and triggers a re-pool). Accept a small seed qrels file now; story 6 replaces
    it with the labeled set.

- id: "5"
  title: "Retrieval innovations: rerank, query rewrite, section-aware weighting + ablation matrix"
  description: >-
    Add cross-encoder re-ranking, HyDE/multi-query rewriting, and section-aware weighting as config
    flags, then generate the full ablation ladder (E1-E4, E5a HyDE, E5b multi-query, E6) with
    failed-before/works-now queries. Implements CAP-3 (assignment Q3).
  spec_checkpoint: true
  invoke_dev_with: >-
    Each innovation is a config flag, never a code fork; every combination runs through the same
    harness from story 4. Query-rewrite routing is mode-specific: HyDE embeddings feed the dense
    leg only (BM25 keeps the raw user query); multi-query variants hit both legs with per-leg RRF
    pooling. Section-aware weighting: each leg retrieves candidate_depth=300 chunks (config value),
    the boost multiplies leg scores over all 300, the leg re-sorts, then the top-50 cut feeds RRF —
    applying the boost after a shallower per-leg cut reproduces the no-op failure mode (relevant
    chunk at rank 63 can never be promoted). Retain at least 2 documented failed-before/works-now
    queries per kept innovation. Section-aware weighting is the novelty hook, so prioritize it.
    The matrix built here runs on seed qrels and is PROVISIONAL: treat the numbers as smoke tests
    of the harness, not as findings; story 6 re-runs everything on the labeled set.

- id: "6"
  title: "Labeling sprint: qrels pooling, QA pairs, guidelines, IAA report"
  description: >-
    Write the >=250 research questions, pool candidates, write labeling guidelines, run the
    100-record pilot, execute the full labeling pass with 15-20% double-labeling, and produce the
    agreement report. Implements CAP-6 and feeds stories 4-5 with real qrels.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Pilot 100 double-labeled records first; compute raw agreement + Cohen's kappa; refine
    guidelines if agreement <80% before the full sprint. JSONL schemas documented per
    evaluation-plan.md; eval set deduplicated and topic-balanced within the corpus's year range
    (ends 2017 — see the 2026-10-12 spike addendum); include the fixed 100-question unanswerable
    slice, committed as disjoint 40-question dev (tau calibration only) + 60-question held-out
    (reported fire rate only) halves; construction rules in the guidelines. Round-2 pooling:
    after this story's round-1 qrels land, add the top-10 of every innovation config (E4, E5a,
    E5b, E6, E6-delta) to the pool and judge the new candidates (evaluation-plan.md pooling
    section). On completion, re-run the full E-ladder (story 5) and the eval harness (story 4)
    against the final qrels, and re-pick the failed-before/works-now queries from those results:
    this story is not done until reports/metrics.json is regenerated on the labeled set. Matrices
    computed on seed qrels are development output only and never enter the report. Whole-team
    annotates; this story coordinates it.

- id: "7"
  title: "Grounded generator: Ollama LLM, citations, insufficient-evidence path, self-check ablation"
  description: >-
    Build the pluggable generator conditioned strictly on the evidence pack, with numbered
    citations, a programmatic resolvability check, the not-enough-evidence path, and the E7
    faithfulness self-check ablation. Implements CAP-4 (assignment Q4/Q5).
  done_checkpoint: true
  invoke_dev_with: >-
    Answers conditioned ONLY on the retrieved evidence pack. Insufficient-evidence path = two-stage
    gate: (1) when rerank is on, best cross-encoder score below config threshold tau (calibrated on
    the 40-question unanswerable dev half only — never the held-out 60; recalibrate per reranker
    model, score scales differ) returns the canned response without calling the generator; (2) the
    prompt makes the model emit an INSUFFICIENT_EVIDENCE marker when passages do not support an
    answer. Acceptance test on the held-out unanswerable half: fires on >=80% of the 60 held-out
    questions, <=10% false-fire on answerable. Programmatic citation resolvability (every [n] maps
    to a retrieved chunk) must be 100%, so make it a test. Generator behind a pluggable interface
    (Ollama local default, free-tier API swappable); model choice is an open question in SPEC.md,
    keep it configurable.

- id: "8"
  title: "Answer-level evaluation: RAGAS, EM/F1, speed protocol"
  description: >-
    Extend the harness with RAGAS answer-level metrics, EM/F1 on the extractive subset, and the
    five-query speed protocol with per-stage latency breakdown. Completes CAP-5.
  invoke_dev_with: >-
    RAGAS with ONE judge fixed for the whole matrix, recorded in metrics.json; the judge must not
    be the generator model (self-judging inflates faithfulness); no mid-matrix judge swap — if the
    judge changes, every row re-runs. Judge a fixed 100-question subsample of the answerable set;
    cache raw judge responses to reports/ragas-cache/ and commit the cache at each milestone cut
    (without the cache, make eval cannot reproduce the numbers at all). EM/F1 only on the
    extractive-answer subset of qa_pairs.jsonl. Record p50/p95 latency per stage and records/sec
    for the performance section of Q4.

- id: "9"
  title: "Streamlit UI: grounded answers with inspectable evidence"
  description: >-
    Build the simple Streamlit app: question in, cited answer out, retrieved papers, supporting
    passages, source links, retrieval inspector, and the five recorded demo queries. Implements
    CAP-7 (assignment Q2).
  invoke_dev_with: >-
    Keep it deliberately simple; the brief explicitly discourages sophisticated UI. Must run on
    laptop CPU. The five demo queries are fixed and their per-query speed is recorded from the UI
    run (Q2 requirement); persist those measurements.

- id: "10"
  title: "Report and reproducibility: README, zips, group-numbered PDF"
  description: >-
    Assemble the final deliverables: README enabling full reproduction, data zip and code zip with
    cloud-drive links, and the single PDF named by group number answering Q1-Q5 mapped 1:1 to
    capabilities. Implements CAP-8.
  done_checkpoint: true
  invoke_dev_with: >-
    Single PDF named <group_number>.pdf (Blackboard, first submission only counts; target
    2026-11-05, deadline 2026-11-07 23:59 SGT). Names + matric numbers on page 1; include pictures
    per the brief. Data zip ships DERIVED artifacts by default: chunk ids, offsets, paper
    metadata, embeddings, indexes, eval datasets, ablation data, and the rebuild script, plus the
    passages actually cited in the report — full corpus texts are regenerated by running make kb,
    not redistributed (scientific_papers license field is unknown; recorded exception in
    SPEC.md data discipline). Code zip: source + README (clone, install, rebuild KB, eval, UI).
    Success = a teammate reproduces from README alone; every reported number traces to make eval
    output.

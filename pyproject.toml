[project]
name = "paperpilot"
version = "0.1.0"
description = "PaperPilot: retrieval-augmented research assistant over arXiv AI/ML/NLP papers (AI6127)."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
